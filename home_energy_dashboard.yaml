              {%- set n = ((s + timedelta(days=20)).replace(day=15) - s).days -%}
              {%- set el = (t - s).total_seconds() / 86400 -%}
              {%- set pu = u / el * n if el >= 1 else u -%}
              {%- set m = 5 + 10 * ((n - el) / n) -%}
              {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
              {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
              {%- set hi = wc.max if wc is defined else 0 -%}
              {%- set wd = wc.disc if wc is defined else 0 -%}
              {%- set disc = tc.disc if tc is defined else 0 -%}
