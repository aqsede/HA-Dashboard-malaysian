            hours_to_show: 2160
            group_by: date
            aggregate_func: avg
            line_width: 2
            font_size: 60
            smoothing: true
            show:
              fill: fade
              points: false
              legend: true
              labels: false
              extrema: false
              average: false
      # ── Temporary (probably duplicate of the above fridge health card) to detect difference in new design vs old functional ───────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: New section
          - type: vertical-stack
            cards:
              - type: gauge
                entity: sensor.fridge_idle_drift
                name: Fridge idle vs best
                min: 0
                max: 40
                needle: true
                segments:
                  - from: 0
                    color: '#43a047'
                  - from: 12
                    color: '#fb8c00'
                  - from: 25
                    color: '#e53935'
              - type: entities
                entities:
                  - entity: sensor.fridge_health_status
                    name: Status
                  - entity: sensor.fridge_health_score
                    name: Health score
                  - entity: sensor.fridge_night_idle_median_30d
                    name: Night idle (30d median)
                  - entity: input_number.fridge_base_night_w
                    name: Best-ever baseline
                  - entity: sensor.fridge_energy_median_30d
                    name: Typical day (grocery days ignored)
                  - entity: sensor.fridge_grocery_days_30d
                    name: Heavy/grocery days (30d)
              - type: history-graph
                title: Night idle W (daily) - 90 days
                hours_to_show: 2160
                entities:
                  - sensor.fridge_night_idle
                  - sensor.fridge_night_idle_median_30d

  
  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 2 — USAGE (history, uses HA's built-in energy cards)
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Usage
    path: usage
    icon: mdi:chart-areaspline
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      # Shared date range for all native Energy cards below.
      - type: grid
        column_span: 2
        cards:
          - type: energy-date-selection
            grid_options:
              columns: full

      # Two consistent-width overview cards on desktop; naturally stack on mobile.
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.monthly_grid_kwh_usage
            primary: >-
              {% set u = states('sensor.monthly_grid_kwh_usage') | float(0) %}
              {% set n = now() %} {% if n.day >= 15 %}
                {% set days = ((n.replace(day=28) + timedelta(days=4)).replace(day=1) - n.replace(day=1)).days %}
                {% set elapsed = n.day - 14 %}
              {% else %}
                {% set prev = n.replace(day=1) - timedelta(days=1) %}
                {% set days = prev.day %}
                {% set elapsed = prev.day - 14 + n.day %}
              {% endif %} {% if elapsed > 0 %}{{ (u / elapsed * days) | round(1)
              }} kWh projected{% else %}Cycle estimate unavailable{% endif %}
            secondary: >-
              {% set u = states('sensor.monthly_grid_kwh_usage') | float(0) %}
              {% set n = now() %} {% if n.day >= 15 %}
                {% set days = ((n.replace(day=28) + timedelta(days=4)).replace(day=1) - n.replace(day=1)).days %}
                {% set elapsed = n.day - 14 %}
              {% else %}
                {% set prev = n.replace(day=1) - timedelta(days=1) %}
                {% set days = prev.day %}
                {% set elapsed = prev.day - 14 + n.day %}
              {% endif %} {{ u | round(1) }} kWh so far · {{ (u / elapsed) |
              round(1) if elapsed > 0 else 0 }} kWh/day · TNB cycle 15–14
            icon: mdi:calendar-sync
            icon_color: >-
              {% set u = states('sensor.monthly_grid_kwh_usage') | float(0) %}
              {% set n = now() %} {% if n.day >= 15 %}
                {% set days = ((n.replace(day=28) + timedelta(days=4)).replace(day=1) - n.replace(day=1)).days %}
                {% set elapsed = n.day - 14 %}
              {% else %}
                {% set prev = n.replace(day=1) - timedelta(days=1) %}
                {% set days = prev.day %}
                {% set elapsed = prev.day - 14 + n.day %}
              {% endif %} {% set projected = (u / elapsed * days) if elapsed > 0
              else u %} {{ 'green' if projected <= 200 else 'amber' if projected
              <= 400 else 'red' }}
            layout: horizontal
            fill_container: true
            tap_action:
              action: more-info
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: custom:mini-graph-card
            name: Whole house · last 24 h
            icon: mdi:home-lightning-bolt
            entities:
              - entity: sensor.energy_meter_main_ct_power
                name: Whole house
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            font_size: 60
            smoothing: true
            color_thresholds:
              - value: 0
                color: '#4ade80'
              - value: 600
                color: '#fbbf24'
              - value: 1500
                color: '#f87171'
            show:
              fill: fade
              points: false
              extrema: true
              average: true
              labels: false
              legend: false
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: custom:mushroom-title-card
            title: Appliance use
            subtitle: >-
              {% set t = now().date() %} {% set s = t.replace(day=15) if t.day
              >= 15 else (t.replace(day=1) - timedelta(days=1)).replace(day=15)
              %} {% set n = ((s + timedelta(days=20)).replace(day=15) - s).days
              %} Billing cycle from {{ s.strftime('%d %b') }} · day {{ (t -
              s).days + 1 }} of {{ n }}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: counter.ac_livingroom_monthly
                layout: vertical
                fill_container: true
                primary: Living room
                secondary: >-
                  {{ states('counter.ac_livingroom_monthly') | int(0) }} uses ·
                  last {{ states('counter.ac_livingroom_last_month') | int(0) }}
                icon: mdi:air-conditioner
                icon_color: >-
                  {{ 'blue' if is_state('input_boolean.ac_livingroom_active',
                  'on') else 'disabled' }}
                badge_icon: >-
                  {{ 'mdi:play' if
                  is_state('input_boolean.ac_livingroom_active', 'on') else ''
                  }}
                badge_color: green
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: counter.ac_masterbedroom_monthly
                layout: vertical
                fill_container: true
                primary: Master bedroom
                secondary: >-
                  {{ states('counter.ac_masterbedroom_monthly') | int(0) }} uses
                  · last {{ states('counter.ac_masterbedroom_last_month') |
                  int(0) }}
                icon: mdi:air-conditioner
                icon_color: >-
                  {{ 'blue' if is_state('input_boolean.ac_masterbedroom_active',
                  'on') else 'disabled' }}
                badge_icon: >-
                  {{ 'mdi:play' if
                  is_state('input_boolean.ac_masterbedroom_active', 'on') else
                  '' }}
                badge_color: green
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: counter.ac_bedroom2_monthly
                layout: vertical
                fill_container: true
                primary: Bedroom 2
                secondary: >-
                  {{ states('counter.ac_bedroom2_monthly') | int(0) }} uses ·
                  last {{ states('counter.ac_bedroom2_last_month') | int(0) }}
                icon: mdi:air-conditioner
                icon_color: >-
                  {{ 'blue' if is_state('input_boolean.ac_bedroom2_active',
                  'on') else 'disabled' }}
                badge_icon: >-
                  {{ 'mdi:play' if is_state('input_boolean.ac_bedroom2_active',
                  'on') else '' }}
                badge_color: green
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: counter.ac_bedroom3_monthly
                layout: vertical
                fill_container: true
                primary: Bedroom 3
                secondary: >-
                  {{ states('counter.ac_bedroom3_monthly') | int(0) }} uses ·
                  last {{ states('counter.ac_bedroom3_last_month') | int(0) }}
                icon: mdi:air-conditioner
                icon_color: >-
                  {{ 'blue' if is_state('input_boolean.ac_bedroom3_active',
                  'on') else 'disabled' }}
                badge_icon: >-
                  {{ 'mdi:play' if is_state('input_boolean.ac_bedroom3_active',
                  'on') else '' }}
                badge_color: green
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                layout: vertical
                fill_container: true
                primary: Aircond total
                secondary: >-
                  {{ expand(['counter.ac_livingroom_monthly',
                  'counter.ac_masterbedroom_monthly',
                  'counter.ac_bedroom2_monthly', 'counter.ac_bedroom3_monthly'])
                  | map(attribute='state') | map('int', 0) | sum }} uses · last
                  {{ expand(['counter.ac_livingroom_last_month',
                  'counter.ac_masterbedroom_last_month',
                  'counter.ac_bedroom2_last_month',
                  'counter.ac_bedroom3_last_month']) | map(attribute='state') |
                  map('int', 0) | sum }}
                icon: mdi:snowflake
                icon_color: >-
                  {{ 'blue' if expand(['input_boolean.ac_livingroom_active',
                  'input_boolean.ac_masterbedroom_active',
                  'input_boolean.ac_bedroom2_active',
                  'input_boolean.ac_bedroom3_active']) | selectattr('state',
                  'eq', 'on') | list | length > 0 else 'disabled' }}
              - type: custom:mushroom-template-card
                entity: counter.dryer_monthly
                layout: vertical
                fill_container: true
                primary: Dryer
                secondary: >-
                  {{ states('counter.dryer_monthly') | int(0) }} cycles · last
                  {{ states('counter.dryer_last_month') | int(0) }}
                icon: mdi:tumble-dryer
                icon_color: >-
                  {{ 'blue' if is_state('input_boolean.dryer_active', 'on') else
                  'disabled' }}
                badge_icon: >-
                  {{ 'mdi:play' if is_state('input_boolean.dryer_active', 'on')
                  else '' }}
                badge_color: green
                tap_action:
                  action: more-info
      - type: grid
        column_span: 2
        cards:
          - type: energy-sankey
            title: Where the electricity goes
            layout: auto
            max_devices: 8
            group_by_area: true
            group_by_floor: true
            show_values: true
            grid_options:
              columns: full

      - type: grid
        column_span: 2
        cards:
          - type: energy-devices-graph
            title: Top devices by energy used
            max_devices: 8
            hide_compound_stats: true
            expand_legend: false
            grid_options:
              columns: full

      # Grouped charts make the custom graphs easier to scan and keep their palette coherent.
      - type: grid
        cards:
          - type: custom:mini-graph-card
            name: Air-conditioning · 24 h
            icon: mdi:air-conditioner
            hours_to_show: 24
            points_per_hour: 4
            height: 150
            line_width: 2
            smoothing: true
            show:
              legend: true
