                secondary: "{{ states('sensor.kitchen_air_fryer_power') | float(0) | round(0) | int }} W"
                icon: mdi:air-fryer
                icon_color: >-
                  {% set w = states('sensor.kitchen_air_fryer_power') | float(0) %}
                  {{ 'disabled' if w < 1 else 'green' if w < 100 else 'amber' if w < 500 else 'red' }}
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: switch.kitchen_rice_cooker
                layout: vertical
                fill_container: true
                primary: Rice Cooker
                secondary: "{{ states('sensor.kitchen_rice_cooker_power') | float(0) | round(0) | int }} W"
                icon: mdi:rice
                icon_color: >-
                  {% set w = states('sensor.kitchen_rice_cooker_power') | float(0) %}
                  {{ 'disabled' if w < 1 else 'green' if w < 100 else 'amber' if w < 500 else 'red' }}
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: switch.elba_hood
                layout: vertical
                fill_container: true
                primary: Elba Hood
                secondary: "{{ states('sensor.elba_hood_power') | float(0) | round(0) | int }} W"
