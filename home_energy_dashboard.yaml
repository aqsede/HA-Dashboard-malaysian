# ─────────────────────────────────────────────────────────────────────────────
# Home Energy dashboard  (Sections view, latest HA)
# Install: Settings → Dashboards → Add dashboard → open it → ⋮ → Edit → ⋮ →
#          Raw configuration editor → paste this whole file → Save.
#
# Needs these HACS frontend cards:
#   Mushroom, mini-graph-card, auto-entities, apexcharts-card
# (no card-mod needed)
#
# Colour rule used everywhere:  grey = idle · green = low · amber = medium · red = high
# ─────────────────────────────────────────────────────────────────────────────
title: Home Energy
views:
  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 1 — POWER (live)
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Power
    path: power
    icon: mdi:flash
    type: sections
    max_columns: 3
    sections:
      # ── 1. RIGHT NOW ──────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Right now
            heading_style: title
            icon: mdi:flash

          # Status chips: only show something when it's true
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:air-conditioner
                icon_color: blue
                content: >-
                  {{ states.climate | rejectattr('state','in',['off','unavailable','unknown']) | list | length }} aircond on
              - type: template
                icon: >-
                  {{ 'mdi:water-boiler' if states('sensor.water_heater_epower')|float(0) > 0 else '' }}
                icon_color: red
                content: >-
                  {{ 'Water heater' if states('sensor.water_heater_epower')|float(0) > 0 else '' }}
              - type: template
                icon: >-
                  {{ 'mdi:microwave' if states('sensor.microwave_epower')|float(0) > 0 else '' }}
                icon_color: amber
                content: >-
                  {{ 'Microwave' if states('sensor.microwave_epower')|float(0) > 0 else '' }}

          # Hero: whole-house watts + 24h sparkline, colour changes with load
          - type: custom:mini-graph-card
            name: Whole house
            icon: mdi:home-lightning-bolt
            entities:
              - entity: sensor.energy_meter_main_ct_power
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            font_size: 70
            animate: true
            smoothing: true
            color_thresholds:
              - value: 0
                color: "#4ade80"
              - value: 600
                color: "#fbbf24"
              - value: 1500
                color: "#f87171"
            show:
              fill: fade
              points: false
              extrema: true
              average: true
              labels: false

          # Bill cycle (15th–14th). Assumes sensor.monthly_grid_kwh_usage resets on the 15th.
          - type: gauge
            entity: sensor.monthly_grid_kwh_usage
            name: This bill cycle (kWh)
            min: 0
            max: 600
            needle: false

          # TNB bill: this cycle (tier, rate, next step) + last cycle.
          # Last cycle reads input_number.tnb_last_cycle_kwh (create it as a helper,
          # set it on the 15th). If it's not set, that row shows "not set".
          - type: custom:config-template-card
            entities:
              - sensor.monthly_grid_kwh_usage
              - input_number.tnb_last_cycle_kwh
            card:
              type: markdown
              content: |
                {% set base = 0.2703 + 0.0455 + 0.1285 %}
                {% set blocks = [
                  {'max': 200, 'disc': -25.0},
                  {'max': 250, 'disc': -24.5},
                  {'max': 300, 'disc': -22.5},
                  {'max': 350, 'disc': -21.0},
                  {'max': 400, 'disc': -17.0},
                  {'max': 450, 'disc': -14.5},
                  {'max': 500, 'disc': -12.0},
                  {'max': 550, 'disc': -10.5},
                  {'max': 600, 'disc': -9.0}
                ] %}

                {# ---- This cycle ---- #}
                {% set u = states('sensor.monthly_grid_kwh_usage') | float(0) %}
                {% set ns = namespace(i=-1) %}
                {% for b in blocks %}{% if ns.i == -1 and u <= b.max %}{% set ns.i = loop.index0 %}{% endif %}{% endfor %}
                {% set inband = ns.i >= 0 %}
                {% set disc = blocks[ns.i].disc if inband else 0 %}
                {% set rate = base + disc / 100 %}
                {% set bill = u * rate %}
                {% set pe = blocks[ns.i - 1].max if ns.i > 0 else 0 %}
                {% set hi = blocks[ns.i].max if inband else 0 %}
                {% set lo = (pe + 1) if ns.i > 0 else 0 %}
                {% set pct = ((u - pe) / (hi - pe) * 100) if inband else 100 %}
                {% set filled = (pct / 10) | round(0) | int %}
                {% set bar = ('▰' * filled) ~ ('▱' * (10 - filled)) %}
                {% set nd = blocks[ns.i + 1].disc if (inband and ns.i + 1 < blocks | length) else 0 %}
                {% set jump = hi * (nd - disc) / 100 %}
                {% set band = (lo ~ '–' ~ hi ~ ' kWh') if inband else 'Above 600 kWh' %}

                {# ---- Last cycle ---- #}
                {% set lu = states('input_number.tnb_last_cycle_kwh') | float(0) %}
                {% set ln = namespace(i=-1) %}
                {% for b in blocks %}{% if ln.i == -1 and lu <= b.max %}{% set ln.i = loop.index0 %}{% endif %}{% endfor %}
                {% set lbill = lu * (base + (blocks[ln.i].disc if ln.i >= 0 else 0) / 100) %}

                ## ⚡ TNB electricity

                **This cycle · RM {{ '%.2f' | format(bill) }}**

                {{ bar }} **{{ '%.2f' | format(u) }} kWh**

                | | |
                |:--|:--|
                | 🧱 **Tier** | {{ band }} |
                | 🏷️ **Rate** | {{ '%.2f' | format(rate * 100) }} sen/kWh |
                | ⏭️ **Next step** | {% if inband %}{{ '%.2f' | format(hi - u) }} kWh to {{ hi }} kWh{% else %}—{% endif %} |
                | ⚠️ **Crossing it adds** | {% if inband %}≈ RM {{ '%.2f' | format(jump) }}{% else %}—{% endif %} |
                | 🗓️ **Last cycle** | {% if has_value('input_number.tnb_last_cycle_kwh') %}{{ '%.2f' | format(lu) }} kWh · RM {{ '%.2f' | format(lbill) }}{% else %}not set{% endif %} |

          # Quick calculator: type any kWh, get the bill (same tier rules)
          - type: entities
            title: ⚡ Quick Bill Calculator
            entities:
              - entity: input_number.kwh_calc_checker
                name: Enter kWh
          - type: custom:config-template-card
            entities:
              - input_number.kwh_calc_checker
            card:
              type: markdown
              content: |
                {% set usage = states('input_number.kwh_calc_checker') | float(0) %}
                {% set base = 0.2703 + 0.0455 + 0.1285 %}
                {% set blocks = [
                  {'max': 200, 'disc': -25.0},
                  {'max': 250, 'disc': -24.5},
                  {'max': 300, 'disc': -22.5},
                  {'max': 350, 'disc': -21.0},
                  {'max': 400, 'disc': -17.0},
                  {'max': 450, 'disc': -14.5},
                  {'max': 500, 'disc': -12.0},
                  {'max': 550, 'disc': -10.5},
                  {'max': 600, 'disc': -9.0}
                ] %}
                {% set ns = namespace(disc=0, found=false) %}
                {% for b in blocks %}{% if not ns.found and usage <= b.max %}{% set ns.disc = b.disc %}{% set ns.found = true %}{% endif %}{% endfor %}
                {% set rate = base + ns.disc / 100 %}
                {% set total = usage * rate %}

                ## 💰 RM {{ '%.2f' | format(total) }}

                **{{ '%.2f' | format(usage) }} kWh** · {{ '%.2f' | format(rate * 100) }} sen/kWh

      # ── 2. TOP CONSUMERS (auto-sorted, live) ──────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Top consumers
            heading_style: title
            icon: mdi:podium
          - type: custom:auto-entities
            show_empty: true
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            sort:
              method: state
              numeric: true
              reverse: true
              count: 8
            filter:
              include:
                # Every power sensor in the house...
                - domain: sensor
                  attributes:
                    device_class: power
                  options: &row
                    type: custom:mushroom-template-card
                    fill_container: true
                    tap_action:
                      action: more-info
                    primary: >-
                      {% set n = {
                        'sensor.fridge_fridge_power': 'Refrigerator',
                        'sensor.hisense_tugs_power': 'Hisense Aircond',
                        'sensor.midea_celest_power': 'Midea Celest',
                        'sensor.midea_all_easy_pro_power': 'Midea AEP',
                        'sensor.celest_bedroom_3_power': 'Midea Celest B3',
                        'sensor.coway_coway_power': 'Coway',
                        'sensor.light_fan_light_fan_power': 'Bed2 · Lights & Fan',
                        'sensor.living_room_tapo_home_server_power': 'Server',
                        'sensor.tapo_computer_plug_power_1': 'Computer',
                        'sensor.tapo_tv_plug_power_1': 'Bedroom TV',
                        'sensor.living_room_tapo_main_tv_power': 'Sharp TV',
                        'sensor.entertainment_power': 'Media, Router & Ext.',
                        'sensor.water_heater_epower': 'Water Heater',
                        'sensor.microwave_epower': 'Microwave',
                        'sensor.washer_dryer_power': 'Washer Dryer',
                        'sensor.kitchen_air_fryer_power': 'Air Fryer',
                        'sensor.elba_hood_power': 'Elba Hood',
                        'sensor.kitchen_rice_cooker_power': 'Rice Cooker',
                        'sensor.living_room_game_console_power': 'PS5',
                        'input_number.lights_watt_baseline': 'Lights & Fans (est.)'
                      } %}
                      {{ n.get(entity, state_attr(entity, 'friendly_name')) }}
                    secondary: >-
                      {{ states(entity) | float(0) | round(0) | int }} W
                    icon: >-
                      {% set i = {
                        'sensor.fridge_fridge_power': 'mdi:fridge',
                        'sensor.hisense_tugs_power': 'mdi:air-conditioner',
                        'sensor.midea_celest_power': 'mdi:air-conditioner',
                        'sensor.midea_all_easy_pro_power': 'mdi:air-conditioner',
                        'sensor.celest_bedroom_3_power': 'mdi:air-conditioner',
                        'sensor.coway_coway_power': 'mdi:air-purifier',
                        'sensor.light_fan_light_fan_power': 'mdi:ceiling-fan-light',
                        'sensor.living_room_tapo_home_server_power': 'mdi:server',
                        'sensor.tapo_computer_plug_power_1': 'mdi:desktop-tower-monitor',
                        'sensor.tapo_tv_plug_power_1': 'mdi:television',
                        'sensor.living_room_tapo_main_tv_power': 'mdi:television',
                        'sensor.entertainment_power': 'mdi:router-wireless',
                        'sensor.water_heater_epower': 'mdi:water-boiler',
                        'sensor.microwave_epower': 'mdi:microwave',
                        'sensor.washer_dryer_power': 'mdi:washing-machine',
                        'sensor.kitchen_air_fryer_power': 'mdi:air-fryer',
                        'sensor.elba_hood_power': 'mdi:range-hood',
                        'sensor.kitchen_rice_cooker_power': 'mdi:rice',
                        'sensor.living_room_game_console_power': 'mdi:sony-playstation',
                        'input_number.lights_watt_baseline': 'mdi:lightbulb-group'
                      } %}
                      {{ i.get(entity, 'mdi:flash') }}
                    icon_color: >-
                      {% set w = states(entity) | float(0) %}
                      {{ 'disabled' if w < 1 else 'green' if w < 100 else 'amber' if w < 500 else 'red' }}
                # ...plus your estimated lights & fans (CT B baseline helper)
                - entity_id: input_number.lights_watt_baseline
                  options: *row
              exclude:
                # Meters / helpers that aren't devices
                - entity_id: sensor.energy_meter_main_ct_power
                - entity_id: sensor.energy_meter_lights_ctb_power
                - entity_id: sensor.shelly_ct_b_remaining_power
                - entity_id: sensor.shelly_ct_b_snapshot
                # Duplicate of Midea Celest (living room)
                - entity_id: sensor.150633094438435_realtime_power
                - state: unavailable
                - state: unknown
                - state: "< 1"
            else:
              type: markdown
              content: Everything is idle 🌙

      # ── 3. AIRCOND (live watts + full control) ────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Aircond
            heading_style: title
            icon: mdi:snowflake

          # Bedroom 2 · Hisense
          - type: vertical-stack
            cards:
              - type: custom:mini-graph-card
                name: Bedroom 2 · Hisense
                icon: mdi:air-conditioner
                entities:
                  - entity: sensor.hisense_tugs_power
                hours_to_show: 12
                points_per_hour: 4
                line_width: 2
                font_size: 60
                smoothing: true
                color_thresholds:
                  - value: 0
                    color: "#4ade80"
                  - value: 400
                    color: "#fbbf24"
                  - value: 900
                    color: "#f87171"
                show:
                  fill: fade
                  points: false
                  legend: false
                  labels: false
              - type: custom:mushroom-climate-card
                entity: climate.ai10tugs
                name: Hisense
                show_temperature_control: true
                collapsible_controls: true
                hvac_modes: [off, cool, dry, fan_only, auto]
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: template
                    entity: switch.ai10tugs_quiet_mode
                    icon: mdi:volume-off
                    content: Quiet
                    icon_color: >-
                      {{ 'blue' if is_state(entity, 'on') else 'disabled' }}
                    tap_action:
                      action: toggle
                  - type: template
                    entity: switch.ai10tugs_fast_heating_cooling
                    icon: mdi:rocket-launch
                    content: Fast cool
                    icon_color: >-
                      {{ 'blue' if is_state(entity, 'on') else 'disabled' }}
                    tap_action:
                      action: toggle

          # Living room · Midea Celest 2HP
          - type: vertical-stack
            cards:
              - type: custom:mini-graph-card
                name: Living room · Celest 2HP
                icon: mdi:air-conditioner
                entities:
                  - entity: sensor.midea_celest_power
                hours_to_show: 12
                points_per_hour: 4
                line_width: 2
                font_size: 60
                smoothing: true
                color_thresholds:
                  - value: 0
                    color: "#4ade80"
                  - value: 400
                    color: "#fbbf24"
                  - value: 900
                    color: "#f87171"
                show:
                  fill: fade
                  points: false
                  legend: false
                  labels: false
              - type: custom:mushroom-climate-card
                entity: climate.150633094438435_climate
                name: Celest 2HP
                show_temperature_control: true
                collapsible_controls: true
                hvac_modes: [off, cool, dry, fan_only, auto]

          # Bedroom · Midea All Easy Pro 1HP
          - type: vertical-stack
            cards:
              - type: custom:mini-graph-card
                name: Bedroom · All Easy Pro 1HP
                icon: mdi:air-conditioner
                entities:
                  - entity: sensor.midea_all_easy_pro_power
                hours_to_show: 12
                points_per_hour: 4
                line_width: 2
                font_size: 60
                smoothing: true
                color_thresholds:
                  - value: 0
                    color: "#4ade80"
                  - value: 400
                    color: "#fbbf24"
                  - value: 900
                    color: "#f87171"
                show:
                  fill: fade
                  points: false
                  legend: false
                  labels: false
              - type: custom:mushroom-climate-card
                entity: climate.151732606038013_climate
                name: All Easy Pro
                show_temperature_control: true
                collapsible_controls: true
                hvac_modes: [off, cool, dry, fan_only, auto]

          # Bedroom 3 · Celest 1HP
          - type: vertical-stack
            cards:
              - type: custom:mini-graph-card
                name: Bedroom 3 · Celest 1HP
                icon: mdi:air-conditioner
                entities:
                  - entity: sensor.celest_bedroom_3_power
                hours_to_show: 12
                points_per_hour: 4
                line_width: 2
                font_size: 60
                smoothing: true
                color_thresholds:
                  - value: 0
                    color: "#4ade80"
                  - value: 400
                    color: "#fbbf24"
                  - value: 900
                    color: "#f87171"
                show:
                  fill: fade
                  points: false
                  legend: false
                  labels: false
              - type: custom:mushroom-climate-card
                entity: climate.150633095125593_climate
                name: Celest 1HP
                show_temperature_control: true
                collapsible_controls: true
                hvac_modes: [off, cool, dry, fan_only, auto]

      # ── 4. KITCHEN ────────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Kitchen
            subtitle: >-
              {{ expand([
                'sensor.fridge_fridge_power', 'sensor.coway_coway_power',
                'sensor.kitchen_air_fryer_power', 'sensor.kitchen_rice_cooker_power',
                'sensor.elba_hood_power', 'sensor.microwave_epower'
              ]) | map(attribute='state') | map('float', 0) | sum | round(0) | int }} W now
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.fridge_fridge_power
                layout: vertical
                fill_container: true
                primary: Refrigerator
                secondary: "{{ states('sensor.fridge_fridge_power') | float(0) | round(0) | int }} W"
                icon: mdi:fridge
