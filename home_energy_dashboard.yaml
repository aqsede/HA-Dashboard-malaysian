                  {% set w = states('sensor.microwave_epower') | float(0) %}
                  {{ 'disabled' if w < 1 else 'green' if w < 100 else 'amber' if w < 500 else 'red' }}
                tap_action:
                  action: more-info

      # ── 5. LIVING ROOM ────────────────────────────────────────────────────
