            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.fridge_night_idle_median_30d
                layout: vertical
                fill_container: true
                primary: >-
                  {% if has_value(entity) %}{{ states(entity) | float(0) |
