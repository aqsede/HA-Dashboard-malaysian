# ─────────────────────────────────────────────────────────────────────────────
# Home Energy dashboard  (Sections view, latest HA)
# Install: Settings → Dashboards → Add dashboard → open it → ⋮ → Edit → ⋮ →
#          Raw configuration editor → paste this whole file → Save.
#
# Needs these HACS frontend cards:
#   Mushroom, mini-graph-card, auto-entities, apexcharts-card
# (no card-mod needed)
#
# Colour rule used everywhere:  grey = idle · green = low · amber = medium · red = high
# ─────────────────────────────────────────────────────────────────────────────
title: Home Energy
views:
  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 1 — POWER (live)
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Power
    path: power
    icon: mdi:flash
    type: sections
    max_columns: 3
    sections:
      # ── 1. RIGHT NOW ──────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Right now
            heading_style: title
            icon: mdi:flash

          # Status chips: only show something when it's true
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:air-conditioner
                icon_color: blue
                content: >-
                  {{ states.climate |
                  rejectattr('state','in',['off','unavailable','unknown']) |
                  list | length }} aircond on
              - type: template
                icon: >-
                  {{ 'mdi:water-boiler' if
                  states('sensor.water_heater_epower')|float(0) > 0 else '' }}
                icon_color: red
                content: >-
                  {{ 'Water heater' if
                  states('sensor.water_heater_epower')|float(0) > 0 else '' }}
              - type: template
                icon: >-
                  {{ 'mdi:microwave' if
                  states('sensor.microwave_epower')|float(0) > 0 else '' }}
                icon_color: amber
                content: >-
                  {{ 'Microwave' if states('sensor.microwave_epower')|float(0) >
                  0 else '' }}

          # Hero: whole-house watts + 24h sparkline, colour changes with load
          - type: custom:mini-graph-card
            name: Whole house
            icon: mdi:home-lightning-bolt
            entities:
              - entity: sensor.energy_meter_main_ct_power
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            font_size: 70
            animate: true
            smoothing: true
            color_thresholds:
              - value: 0
                color: '#4ade80'
              - value: 600
                color: '#fbbf24'
              - value: 1500
                color: '#f87171'
            show:
              fill: fade
              points: false
              extrema: true
              average: true
              labels: false

          # ── TNB electricity: this bill cycle (15th–14th) + last cycle ─────
          # Rebate (EEI) band is set by TOTAL monthly kWh and applies to ALL kWh (cliff, not marginal).
          # tgt = 250 is the cliff being defended. Limit/step/status cards watch max(band of usage, 250).
          # flex = 260: normal home-month range (label only). red = 280: icon turns red only above this.
          # Away months (~240) sit just under 250 and show green/amber depending on the margin m.
          # m = safety buffer: 15 kWh at cycle start, shrinking to 5 kWh at cycle end.
          # k = 1.06 converts your meter kWh to TNB-billed kWh. Recalibrate against a real bill.
          - type: custom:mushroom-title-card
            title: TNB electricity
            subtitle: |-
              {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
              {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
              {%- set k = 1.06 -%}
              {%- set tgt = 250 -%}
              {%- set flex = 260 -%}
              {%- set red = 280 -%}
              {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
              {%- set u = raw * k -%}
              {%- set t = now() -%}
              {%- set s = (t.replace(day=15) if t.day >= 15 else (t.replace(day=1) - timedelta(days=1)).replace(day=15)).replace(hour=0, minute=0, second=0, microsecond=0) -%}
              {%- set n = ((s + timedelta(days=20)).replace(day=15) - s).days -%}
              {%- set el = (t - s).total_seconds() / 86400 -%}
              {%- set pu = u / el * n if el >= 1 else u -%}
              {%- set m = 5 + 10 * ((n - el) / n) -%}
              {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
              {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
              {%- set hi = wc.max if wc is defined else 0 -%}
              {%- set wd = wc.disc if wc is defined else 0 -%}
              {%- set disc = tc.disc if tc is defined else 0 -%}
              {%- set pe = 0 if hi <= tgt else (blocks | selectattr('max', 'lt', hi) | map(attribute='max') | max) -%}
              {%- set lo = pe + 1 if pe > 0 else 0 -%}
              Day {{ (t - s).days + 1 }}/{{ n }} · {% if hi %}{{ ((u - pe) / (hi - pe) * 100) | round(0) | int }}% through the {{ lo }}–{{ hi }} kWh tier{% else %}Above all tiers · no rebate{% endif %}
          - type: custom:mushroom-template-card
            entity: sensor.monthly_grid_kwh_usage
            layout: horizontal
            fill_container: true
            multiline_secondary: true
            tap_action:
              action: more-info
            primary: |-
              {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
              {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
              {%- set k = 1.06 -%}
              {%- set tgt = 250 -%}
              {%- set flex = 260 -%}
              {%- set red = 280 -%}
              {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
              {%- set u = raw * k -%}
              {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
              {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
              {%- set hi = wc.max if wc is defined else 0 -%}
              {%- set wd = wc.disc if wc is defined else 0 -%}
              {%- set disc = tc.disc if tc is defined else 0 -%}
              ~RM {{ '%.2f' | format(u * (base + disc / 100)) }} if billed today
            secondary: |-
              {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
              {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
              {%- set k = 1.06 -%}
              {%- set tgt = 250 -%}
              {%- set flex = 260 -%}
              {%- set red = 280 -%}
              {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
              {%- set u = raw * k -%}
              {%- set t = now() -%}
              {%- set s = (t.replace(day=15) if t.day >= 15 else (t.replace(day=1) - timedelta(days=1)).replace(day=15)).replace(hour=0, minute=0, second=0, microsecond=0) -%}
              {%- set n = ((s + timedelta(days=20)).replace(day=15) - s).days -%}
              {%- set el = (t - s).total_seconds() / 86400 -%}
              {%- set pu = u / el * n if el >= 1 else u -%}
              {%- set m = 5 + 10 * ((n - el) / n) -%}
              {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
              {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
              {%- set hi = wc.max if wc is defined else 0 -%}
              {%- set wd = wc.disc if wc is defined else 0 -%}
              {%- set disc = tc.disc if tc is defined else 0 -%}
              {%- set pc = blocks | selectattr('max', 'ge', pu) | first -%}
              {%- set pd = pc.disc if pc is defined else 0 -%}
              {%- set projc = pu * (base + pd / 100) -%}
              {%- set atcap = hi * (base + wd / 100) if hi else 0 -%}
              {{ '%.1f' | format(u) }} kWh TNB est. · meter {{ '%.1f' | format(raw) }}
              {{- '\n' -}}
              {%- if el < 1 -%}Projection starts after day 1
              {%- else -%}Projected {{ pu | round(0) | int }} kWh{% if pu > tgt and pu <= flex %} (home-month range){% endif %} → ~RM {{ '%.2f' | format(projc) }}
              {%- if hi and pu > hi %}{{- '\n' -}}+{{ '%.1f' | format(pu - hi) }} kWh over {{ hi }} → ~RM {{ '%.2f' | format(projc - atcap) }} extra{%- endif -%}
              {%- endif -%}
            icon: mdi:flash
            icon_color: |-
              {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
              {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
              {%- set k = 1.06 -%}
              {%- set tgt = 250 -%}
              {%- set flex = 260 -%}
              {%- set red = 280 -%}
              {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
              {%- set u = raw * k -%}
              {%- set t = now() -%}
              {%- set s = (t.replace(day=15) if t.day >= 15 else (t.replace(day=1) - timedelta(days=1)).replace(day=15)).replace(hour=0, minute=0, second=0, microsecond=0) -%}
              {%- set n = ((s + timedelta(days=20)).replace(day=15) - s).days -%}
              {%- set el = (t - s).total_seconds() / 86400 -%}
              {%- set pu = u / el * n if el >= 1 else u -%}
              {%- set m = 5 + 10 * ((n - el) / n) -%}
              {{ 'red' if pu > red else ('amber' if pu > tgt - m else 'green') }}
            grid_options:
              columns: full
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                layout: vertical
                fill_container: true
                multiline_secondary: true
                primary: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
                  {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
                  {%- set hi = wc.max if wc is defined else 0 -%}
                  {%- set wd = wc.disc if wc is defined else 0 -%}
                  {%- set disc = tc.disc if tc is defined else 0 -%}
                  {%- set pe = 0 if hi <= tgt else (blocks | selectattr('max', 'lt', hi) | map(attribute='max') | max) -%}
                  {%- set lo = pe + 1 if pe > 0 else 0 -%}
                  {% if hi %}{{ lo }}–{{ hi }} kWh{% else %}600+ kWh{% endif %}
                secondary: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
                  {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
                  {%- set hi = wc.max if wc is defined else 0 -%}
                  {%- set wd = wc.disc if wc is defined else 0 -%}
                  {%- set disc = tc.disc if tc is defined else 0 -%}
                  {{ '%.2f' | format((base + wd / 100) * 100) }} sen/kWh
                icon: mdi:layers-outline
                icon_color: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {{ 'green' if u <= tgt else 'red' }}
              - type: custom:mushroom-template-card
                layout: vertical
                fill_container: true
                multiline_secondary: true
                primary: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
                  {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
                  {%- set hi = wc.max if wc is defined else 0 -%}
                  {%- set wd = wc.disc if wc is defined else 0 -%}
                  {%- set disc = tc.disc if tc is defined else 0 -%}
                  {% if hi %}{{ '%.1f' | format(hi - u) }} kWh{% else %}Top tier{% endif %}
                secondary: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set t = now() -%}
                  {%- set s = (t.replace(day=15) if t.day >= 15 else (t.replace(day=1) - timedelta(days=1)).replace(day=15)).replace(hour=0, minute=0, second=0, microsecond=0) -%}
                  {%- set n = ((s + timedelta(days=20)).replace(day=15) - s).days -%}
                  {%- set el = (t - s).total_seconds() / 86400 -%}
                  {%- set pu = u / el * n if el >= 1 else u -%}
                  {%- set m = 5 + 10 * ((n - el) / n) -%}
                  {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
                  {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
                  {%- set hi = wc.max if wc is defined else 0 -%}
                  {%- set wd = wc.disc if wc is defined else 0 -%}
                  {%- set disc = tc.disc if tc is defined else 0 -%}
                  {%- if not hi -%}no rebate left
                  {%- elif n - el >= 0.5 -%}to {{ hi }} · ≤ {{ '%.1f' | format((hi - u) / (n - el)) }}/day{% if el >= 1 %} (avg {{ '%.1f' | format(u / el) }}){% endif %}
                  {%- else -%}last stretch before {{ hi }} kWh
                  {%- endif -%}
                icon: mdi:arrow-right-circle-outline
                icon_color: blue
              - type: custom:mushroom-template-card
                layout: vertical
                fill_container: true
                multiline_secondary: true
                primary: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
                  {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
                  {%- set hi = wc.max if wc is defined else 0 -%}
                  {%- set wd = wc.disc if wc is defined else 0 -%}
                  {%- set disc = tc.disc if tc is defined else 0 -%}
                  {%- set nx = blocks | selectattr('max', 'gt', hi) | first -%}
                  {%- set nr = (base + nx.disc / 100) if nx is defined else base -%}
                  {%- set step = (hi * (nr - (base + wd / 100)) + nr) if hi else 0 -%}
                  {% if hi %}+RM {{ '%.2f' | format(step) }}{% else %}—{% endif %}
                secondary: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set t = now() -%}
                  {%- set s = (t.replace(day=15) if t.day >= 15 else (t.replace(day=1) - timedelta(days=1)).replace(day=15)).replace(hour=0, minute=0, second=0, microsecond=0) -%}
                  {%- set n = ((s + timedelta(days=20)).replace(day=15) - s).days -%}
                  {%- set el = (t - s).total_seconds() / 86400 -%}
                  {%- set pu = u / el * n if el >= 1 else u -%}
                  {%- set m = 5 + 10 * ((n - el) / n) -%}
                  {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
                  {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
                  {%- set hi = wc.max if wc is defined else 0 -%}
                  {%- set wd = wc.disc if wc is defined else 0 -%}
                  {%- set disc = tc.disc if tc is defined else 0 -%}
                  {%- set cross = hi > 0 and pu > hi -%}
                  {%- set avg = u / el if el >= 1 else u -%}
                  {%- if not hi -%}no more steps
                  {%- elif el < 1 -%}if you pass {{ hi }} kWh
                  {%- elif cross -%}hit ~{{ (t + timedelta(days=(hi - u) / avg)).strftime('%d %b') }} at this pace
                  {%- elif hi - pu <= m -%}tight · {{ '%.0f' | format(hi - pu) }} kWh margin
                  {%- else -%}safe · {{ '%.0f' | format(hi - pu) }} kWh margin
                  {%- endif -%}
                icon: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set t = now() -%}
                  {%- set s = (t.replace(day=15) if t.day >= 15 else (t.replace(day=1) - timedelta(days=1)).replace(day=15)).replace(hour=0, minute=0, second=0, microsecond=0) -%}
                  {%- set n = ((s + timedelta(days=20)).replace(day=15) - s).days -%}
                  {%- set el = (t - s).total_seconds() / 86400 -%}
                  {%- set pu = u / el * n if el >= 1 else u -%}
                  {%- set m = 5 + 10 * ((n - el) / n) -%}
                  {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
                  {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
                  {%- set hi = wc.max if wc is defined else 0 -%}
                  {%- set wd = wc.disc if wc is defined else 0 -%}
                  {%- set disc = tc.disc if tc is defined else 0 -%}
                  {%- set cross = hi > 0 and pu > hi -%}
                  {%- set avg = u / el if el >= 1 else u -%}
                  {{ 'mdi:alert-outline' if not hi or cross or hi - pu <= m else 'mdi:check-circle-outline' }}
                icon_color: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set t = now() -%}
                  {%- set s = (t.replace(day=15) if t.day >= 15 else (t.replace(day=1) - timedelta(days=1)).replace(day=15)).replace(hour=0, minute=0, second=0, microsecond=0) -%}
                  {%- set n = ((s + timedelta(days=20)).replace(day=15) - s).days -%}
                  {%- set el = (t - s).total_seconds() / 86400 -%}
                  {%- set pu = u / el * n if el >= 1 else u -%}
                  {%- set m = 5 + 10 * ((n - el) / n) -%}
                  {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
                  {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
                  {%- set hi = wc.max if wc is defined else 0 -%}
                  {%- set wd = wc.disc if wc is defined else 0 -%}
                  {%- set disc = tc.disc if tc is defined else 0 -%}
                  {%- set cross = hi > 0 and pu > hi -%}
                  {%- set avg = u / el if el >= 1 else u -%}
                  {{ 'disabled' if not hi else 'red' if pu > red else 'amber' if cross or hi - pu <= m else 'green' }}
              - type: custom:mushroom-template-card
                layout: vertical
                fill_container: true
                multiline_secondary: true
                primary: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set lp = state_attr('sensor.monthly_grid_kwh_usage', 'last_period') -%}
                  {%- set lu = (lp | float(0)) * k -%}
                  {%- set lt = blocks | selectattr('max', 'ge', lu) | first -%}
                  {%- set ld = lt.disc if lt is defined else 0 -%}
                  {% if lp is not none %}RM {{ '%.2f' | format(lu * (base + ld / 100)) }}{% else %}—{% endif %}
                secondary: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set lp = state_attr('sensor.monthly_grid_kwh_usage', 'last_period') -%}
                  {%- set lu = (lp | float(0)) * k -%}
                  {%- set lt = blocks | selectattr('max', 'ge', lu) | first -%}
                  {%- set ld = lt.disc if lt is defined else 0 -%}
                  {% if lp is not none %}last cycle · {{ '%.1f' | format(lu) }} kWh{% else %}last cycle not found{% endif %}
                icon: mdi:calendar-month-outline
                icon_color: disabled

