              {{ (states('sensor.fridge_health_status') | replace('_', ' ') |
              title) if has_value('sensor.fridge_health_status') else 'No data' }}
            secondary: >-
              {% if has_value('sensor.fridge_idle_drift') %}drift {{
              states('sensor.fridge_idle_drift') | float(0) | round(1) }} {{
              state_attr('sensor.fridge_idle_drift', 'unit_of_measurement') or
              '' }} from best{% else %}drift unavailable{% endif %}{% if
              has_value('sensor.fridge_health_score') %} · score {{
              states('sensor.fridge_health_score') }}{% endif %}
