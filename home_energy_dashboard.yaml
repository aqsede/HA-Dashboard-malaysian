                      {{ 'disabled' if w < 1 else 'green' if w <= b[0] else 'amber' if w <= b[1] else 'red' }}
              exclude:
                # Meters and helpers that are not devices
                - entity_id: sensor.energy_meter_main_ct_power
                - entity_id: sensor.energy_meter_lights_ctb_power
                - entity_id: sensor.shelly_ct_b_remaining_power
                - entity_id: sensor.shelly_ct_b_snapshot
                # Virtual light/fan sensors and the CT B net signal are a breakdown of Bed2 Lights and Fan / Lights and Fans (est.)
                - entity_id: sensor.virtual_*
                - entity_id: sensor.lights_ctb_net_power
                # Router and Ext. total INCLUDES server + Sharp TV + PS5, so it would rank by the wrong number. It has its own tile in Rooms.
                - entity_id: sensor.entertainment_power
                # Duplicate of Midea Celest (living room)
                - entity_id: sensor.150633094438435_realtime_power
                # Fridge learning helpers
                - entity_id: sensor.fridge_night_idle
                - entity_id: sensor.fridge_night_idle_power
                # Not a device (currently unknown; would show as a 2nd 'Fridge' if it comes alive)
                - entity_id: sensor.all_standby_power
                - entity_id: sensor.fridge_power_1h
                - entity_id: sensor.fridge_idle_floor
                - entity_id: sensor.fridge_idle_floor_24h
                - entity_id: sensor.fridge_idle_floor_median_30d
