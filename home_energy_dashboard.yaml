      # FRIDGE HEALTH  gauge replaces the old duplicate section
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Fridge health
            subtitle: Idle floor vs your best-ever baseline
          # Drift is computed here (24h idle floor minus best-ever floor) because
          # sensor.fridge_health_status / _score / _idle_drift do not exist in this HA.
          - type: custom:mushroom-template-card
            entity: sensor.fridge_idle_floor_24h
            layout: horizontal
            fill_container: true
            tap_action:
              action: more-info
            primary: |-
              {%- if has_value('sensor.fridge_idle_floor_24h') and has_value('input_number.fridge_base_idle_w') -%}
              {%- set d = [states('sensor.fridge_idle_floor_24h') | float(0) - states('input_number.fridge_base_idle_w') | float(0), 0] | max -%}
              {{ 'Healthy' if d < 20 else 'Watch' if d < 32 else 'Check fridge' }}
              {%- else -%}No data{%- endif -%}
            secondary: |-
              {%- if has_value('sensor.fridge_idle_floor_24h') and has_value('input_number.fridge_base_idle_w') -%}
              {%- set f = states('sensor.fridge_idle_floor_24h') | float(0) -%}
              {%- set d = [f - states('input_number.fridge_base_idle_w') | float(0), 0] | max -%}
              {{ f | round(0) | int }} W idle floor · +{{ d | round(1) }} W vs best{% if is_state('binary_sensor.fridge_sustained_high_load', 'on') %} · working hard{% endif %}
              {%- else -%}Idle floor unavailable{%- endif -%}
            icon: |-
              {%- set d = states('sensor.fridge_idle_floor_24h') | float(0) - states('input_number.fridge_base_idle_w') | float(0) -%}
              {{ 'mdi:fridge-alert' if has_value('sensor.fridge_idle_floor_24h') and d >= 32 else 'mdi:fridge' }}
            icon_color: |-
              {%- if not (has_value('sensor.fridge_idle_floor_24h') and has_value('input_number.fridge_base_idle_w')) -%}disabled
              {%- else -%}
              {%- set d = states('sensor.fridge_idle_floor_24h') | float(0) - states('input_number.fridge_base_idle_w') | float(0) -%}
              {{ 'green' if d < 20 else 'amber' if d < 32 else 'red' }}
              {%- endif -%}
          # Core gauge cannot take a template, so segments are absolute watts:
          # best-ever floor is ~50 W, so amber starts at best+20 (70 W) and red at best+32 (82 W).
          # Re-tune if input_number.fridge_base_idle_w moves a lot.
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.fridge_idle_floor_24h
                state_not:
                  - unavailable
                  - unknown
            card:
              type: gauge
              entity: sensor.fridge_idle_floor_24h
              name: Idle floor · 24 h
              min: 30
              max: 100
              needle: true
              segments:
                - from: 30
                  color: '#43a047'
                - from: 70
                  color: '#fb8c00'
                - from: 82
                  color: '#e53935'
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.fridge_idle_floor_median_30d
                layout: vertical
                fill_container: true
                primary: "{% if has_value(entity) %}{{ states(entity) | float(0) | round(1) }} {{ state_attr(entity, 'unit_of_measurement') or 'W' }}{% else %}—{% endif %}"
                secondary: Idle floor · 30d median
                icon: mdi:gauge-low
                icon_color: blue
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: input_number.fridge_base_idle_w
                layout: vertical
                fill_container: true
                primary: "{% if has_value(entity) %}{{ states(entity) | float(0) | round(1) }} {{ state_attr(entity, 'unit_of_measurement') or 'W' }}{% else %}—{% endif %}"
                secondary: Best-ever idle floor
                icon: mdi:trophy-outline
                icon_color: green
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.fridge_power_1h
                layout: vertical
                fill_container: true
                primary: '{% if has_value(entity) %}{{ states(entity) | float(0) | round(0) | int }} W{% else %}—{% endif %}'
                secondary: "{% if is_state('binary_sensor.fridge_sustained_high_load', 'on') %}Working hard · 1h avg{% else %}Now · 1h avg{% endif %}"
                icon: mdi:flash-outline
                icon_color: "{% if is_state('binary_sensor.fridge_sustained_high_load', 'on') %}red{% elif not has_value(entity) %}disabled{% else %}green{% endif %}"
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.fridge_energy_median_30d
                layout: vertical
                fill_container: true
                primary: "{% if has_value(entity) %}{{ states(entity) | float(0) | round(1) }} {{ state_attr(entity, 'unit_of_measurement') or '' }}{% else %}—{% endif %}"
                secondary: Typical day · 30d
                icon: mdi:calendar-today
                icon_color: amber
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.fridge_energy_yesterday
                layout: vertical
                fill_container: true
                primary: "{% if has_value(entity) %}{{ states(entity) | float(0) | round(2) }} {{ state_attr(entity, 'unit_of_measurement') or 'kWh' }}{% else %}—{% endif %}"
                secondary: Yesterday
                icon: mdi:calendar-arrow-left
                icon_color: "{% set m = states('sensor.fridge_energy_median_30d') | float(0) %}{% set y = states(entity) | float(0) %}{{ 'disabled' if not has_value(entity) else 'green' if (m == 0 or y <= m * 1.15) else 'amber' }}"
                tap_action:
                  action: more-info
          - type: custom:mini-graph-card
            name: Idle floor · 90 days
            icon: mdi:fridge-outline
            entities:
              - entity: sensor.fridge_idle_floor
                name: Daily floor
                color: '#60a5fa'
              - entity: sensor.fridge_idle_floor_median_30d
                name: 30d median
                color: '#fbbf24'
                show_fill: false
              - entity: input_number.fridge_base_idle_w
                name: Best
                color: '#4ade80'
                show_fill: false
            hours_to_show: 2160
            group_by: date
            aggregate_func: avg
            line_width: 2
            font_size: 60
            smoothing: true
            show:
              fill: fade
              points: false
              legend: true
              labels: false
              extrema: false
              average: false
