                  {% set w = states('sensor.fridge_fridge_power') | float(0) %}
                  {{ 'disabled' if w < 1 else 'green' if w < 100 else 'amber' if w < 500 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: switch.coway_coway
                layout: vertical
                fill_container: true
                primary: Coway
                secondary: "{{ states('sensor.coway_coway_power') | float(0) | round(0) | int }} W"
                icon: mdi:air-purifier
                icon_color: >-
                  {% set w = states('sensor.coway_coway_power') | float(0) %}
                  {{ 'disabled' if w < 1 else 'green' if w < 100 else 'amber' if w < 500 else 'red' }}
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: switch.kitchen_air_fryer
                layout: vertical
