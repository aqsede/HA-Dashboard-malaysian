      # ── 6. BEDROOM 2 + YARD / ESTIMATED ───────────────────────────────────
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Bedroom 2
            subtitle: >-
              {{ expand([
                'sensor.tapo_computer_plug_power_1', 'sensor.tapo_tv_plug_power_1',
                'sensor.light_fan_light_fan_power'
              ]) | map(attribute='state') | map('float', 0) | sum | round(0) | int }} W now
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: switch.tapo_computer_plug
                layout: vertical
                fill_container: true
