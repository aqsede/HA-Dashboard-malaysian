              columns: full
  - title: Usage
    path: usage
    icon: mdi:chart-areaspline
    theme: Energy Slate
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      # Shared date range for all native Energy cards below
      - type: grid
        column_span: 2
        cards:
          - type: energy-date-selection
            grid_options:
              columns: full
      # Live stacked picture of the last 24 h
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Where the watts went · 24 h
              show_states: false
            graph_span: 24h
            chart_type: line
            stacked: true
            yaxis:
              - min: 0
                decimals: 0
            apex_config:
              chart:
                type: area
                stacked: true
                height: 340
              fill:
                opacity: 0.55
              stroke:
                curve: smooth
                width: 1
              legend:
                show: true
                position: bottom
              dataLabels:
                enabled: false
            all_series_config:
              group_by:
                func: avg
                duration: 15min
              stroke_width: 1
            series:
              - entity: sensor.midea_celest_power
                name: Celest 2HP
                color: '#60a5fa'
              - entity: sensor.hisense_tugs_power
                name: Hisense
                color: '#2563eb'
