# ─────────────────────────────────────────────────────────────────────────────
# Home Energy dashboard  (Sections view, latest HA)
# Install: Settings → Dashboards → Add dashboard → open it → ⋮ → Edit → ⋮ →
#          Raw configuration editor → paste this whole file → Save.
#
# Needs these HACS frontend cards:
#   Mushroom, mini-graph-card, auto-entities, apexcharts-card
# (no card-mod needed)
#
# Colour rule used everywhere:  grey = idle · green = low · amber = medium · red = high
# ─────────────────────────────────────────────────────────────────────────────
title: Home Energy
views:
  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 1 — POWER (live)
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Power
    path: power
    icon: mdi:flash
    type: sections
    max_columns: 3
    sections:
      # ── 1. RIGHT NOW ──────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Right now
            heading_style: title
            icon: mdi:flash

          # Status chips: only show something when it's true
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:air-conditioner
                icon_color: blue
                content: >-
                  {{ states.climate |
                  rejectattr('state','in',['off','unavailable','unknown']) |
                  list | length }} aircond on
              - type: template
                icon: >-
                  {{ 'mdi:water-boiler' if
                  states('sensor.water_heater_epower')|float(0) > 0 else '' }}
                icon_color: red
                content: >-
                  {{ 'Water heater' if
                  states('sensor.water_heater_epower')|float(0) > 0 else '' }}
              - type: template
                icon: >-
                  {{ 'mdi:microwave' if
                  states('sensor.microwave_epower')|float(0) > 0 else '' }}
                icon_color: amber
                content: >-
                  {{ 'Microwave' if states('sensor.microwave_epower')|float(0) >
                  0 else '' }}

          # Hero: whole-house watts + 24h sparkline, colour changes with load
          - type: custom:mini-graph-card
            name: Whole house
            icon: mdi:home-lightning-bolt
            entities:
              - entity: sensor.energy_meter_main_ct_power
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            font_size: 70
            animate: true
            smoothing: true
            color_thresholds:
              - value: 0
                color: '#4ade80'
              - value: 600
                color: '#fbbf24'
              - value: 1500
                color: '#f87171'
            show:
              fill: fade
              points: false
              extrema: true
              average: true
              labels: false

          # ── TNB electricity: this bill cycle (15th–14th) + last cycle ─────
          # Last cycle comes from the last_period attribute of sensor.monthly_grid_kwh_usage.
          - type: custom:mushroom-title-card
            title: TNB electricity
            subtitle: >-
              {% set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc':
              -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0},
              {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max':
              500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600,
              'disc': -9.0}] %} {% set u =
              states('sensor.monthly_grid_kwh_usage') | float(0) %} {% set t =
              blocks | selectattr('max', 'ge', u) | first %}{% set hi = t.max if
              t is defined else 0 %}{% set disc = t.disc if t is defined else 0
              %} {% set pe = ((blocks | selectattr('max', 'lt', hi) |
              map(attribute='max') | list) + [0]) | max %}{% set lo = pe + 1 if
              pe > 0 else 0 %} {% if hi %}{{ ((u - pe) / (hi - pe) * 100) |
              round(0) | int }}% through the {{ lo }}–{{ hi }} kWh tier{% else
              %}Above all tiers · no discount{% endif %}
          - type: custom:mushroom-template-card
            entity: sensor.monthly_grid_kwh_usage
            layout: horizontal
            fill_container: true
            tap_action:
              action: more-info
            primary: >-
              {% set base = 0.2703 + 0.0455 + 0.1285 %} {% set blocks = [{'max':
              200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300,
              'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc':
              -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0},
              {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] %} {% set
              u = states('sensor.monthly_grid_kwh_usage') | float(0) %} {% set t
              = blocks | selectattr('max', 'ge', u) | first %}{% set hi = t.max
              if t is defined else 0 %}{% set disc = t.disc if t is defined else
              0 %} RM {{ '%.2f' | format(u * (base + disc / 100)) }}
            secondary: >-
              {% set u = states('sensor.monthly_grid_kwh_usage') | float(0) %}
              {{ '%.2f' | format(u) }} kWh this cycle
            icon: mdi:flash
            icon_color: >-
              {% set u = states('sensor.monthly_grid_kwh_usage') | float(0) %}
              {{ 'green' if u <= 200 else ('amber' if u <= 400 else 'red') }}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                layout: vertical
                fill_container: true
                primary: >-
                  {% set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250,
                  'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350,
                  'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450,
                  'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550,
                  'disc': -10.5}, {'max': 600, 'disc': -9.0}] %} {% set u =
                  states('sensor.monthly_grid_kwh_usage') | float(0) %} {% set t
                  = blocks | selectattr('max', 'ge', u) | first %}{% set hi =
                  t.max if t is defined else 0 %}{% set disc = t.disc if t is
                  defined else 0 %} {% set pe = ((blocks | selectattr('max',
                  'lt', hi) | map(attribute='max') | list) + [0]) | max %}{% set
                  lo = pe + 1 if pe > 0 else 0 %} {% if hi %}{{ lo }}–{{ hi }}
                  kWh{% else %}600+ kWh{% endif %}
                secondary: >-
                  {% set base = 0.2703 + 0.0455 + 0.1285 %} {% set blocks =
                  [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5},
                  {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0},
                  {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5},
                  {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5},
                  {'max': 600, 'disc': -9.0}] %} {% set u =
                  states('sensor.monthly_grid_kwh_usage') | float(0) %} {% set t
                  = blocks | selectattr('max', 'ge', u) | first %}{% set hi =
                  t.max if t is defined else 0 %}{% set disc = t.disc if t is
                  defined else 0 %} {{ '%.2f' | format((base + disc / 100) *
                  100) }} sen/kWh
                icon: mdi:layers-outline
                icon_color: >-
                  {% set u = states('sensor.monthly_grid_kwh_usage') | float(0)
                  %} {{ 'green' if u <= 200 else ('amber' if u <= 400 else
                  'red') }}
              - type: custom:mushroom-template-card
                layout: vertical
                fill_container: true
                primary: >-
                  {% set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250,
                  'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350,
                  'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450,
                  'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550,
                  'disc': -10.5}, {'max': 600, 'disc': -9.0}] %} {% set u =
                  states('sensor.monthly_grid_kwh_usage') | float(0) %} {% set t
                  = blocks | selectattr('max', 'ge', u) | first %}{% set hi =
                  t.max if t is defined else 0 %}{% set disc = t.disc if t is
                  defined else 0 %} {% if hi %}{{ '%.1f' | format(hi - u) }}
                  kWh{% else %}Top tier{% endif %}
                secondary: >-
                  {% set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250,
                  'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350,
                  'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450,
                  'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550,
                  'disc': -10.5}, {'max': 600, 'disc': -9.0}] %} {% set u =
                  states('sensor.monthly_grid_kwh_usage') | float(0) %} {% set t
                  = blocks | selectattr('max', 'ge', u) | first %}{% set hi =
                  t.max if t is defined else 0 %}{% set disc = t.disc if t is
                  defined else 0 %} {% if hi %}left before {{ hi }} kWh{% else
                  %}no discount left{% endif %}
                icon: mdi:arrow-right-circle-outline
                icon_color: blue
              - type: custom:mushroom-template-card
                layout: vertical
                fill_container: true
                primary: >-
                  {% set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250,
                  'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350,
                  'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450,
                  'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550,
                  'disc': -10.5}, {'max': 600, 'disc': -9.0}] %} {% set u =
                  states('sensor.monthly_grid_kwh_usage') | float(0) %} {% set t
                  = blocks | selectattr('max', 'ge', u) | first %}{% set hi =
                  t.max if t is defined else 0 %}{% set disc = t.disc if t is
                  defined else 0 %} {% set nx = blocks | selectattr('max', 'gt',
                  hi) | first %}{% set nd = nx.disc if nx is defined else 0 %}
                  {% if hi %}+RM {{ '%.2f' | format(hi * (nd - disc) / 100) }}{%
                  else %}—{% endif %}
                secondary: >-
                  {% set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250,
                  'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350,
                  'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450,
                  'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550,
                  'disc': -10.5}, {'max': 600, 'disc': -9.0}] %} {% set u =
                  states('sensor.monthly_grid_kwh_usage') | float(0) %} {% set t
                  = blocks | selectattr('max', 'ge', u) | first %}{% set hi =
                  t.max if t is defined else 0 %}{% set disc = t.disc if t is
                  defined else 0 %} {% if hi %}if you pass {{ hi }} kWh{% else
                  %}no more steps{% endif %}
                icon: mdi:alert-outline
                icon_color: >-
                  {% set u = states('sensor.monthly_grid_kwh_usage') | float(0)
                  %} {{ 'amber' if u <= 600 else 'disabled' }}
              - type: custom:mushroom-template-card
                layout: vertical
                fill_container: true
                primary: >-
                  {% set base = 0.2703 + 0.0455 + 0.1285 %} {% set blocks =
                  [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5},
                  {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0},
                  {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5},
                  {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5},
                  {'max': 600, 'disc': -9.0}] %} {% set lp =
                  state_attr('sensor.monthly_grid_kwh_usage', 'last_period')
                  %}{% set lu = lp | float(0) %}{% set lt = blocks |
                  selectattr('max', 'ge', lu) | first %}{% set ld = lt.disc if
                  lt is defined else 0 %} {% if lp is not none %}RM {{ '%.2f' |
                  format(lu * (base + ld / 100)) }}{% else %}—{% endif %}
                secondary: >-
                  {% set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250,
                  'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350,
                  'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450,
                  'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550,
                  'disc': -10.5}, {'max': 600, 'disc': -9.0}] %} {% set lp =
                  state_attr('sensor.monthly_grid_kwh_usage', 'last_period')
                  %}{% set lu = lp | float(0) %}{% set lt = blocks |
                  selectattr('max', 'ge', lu) | first %}{% set ld = lt.disc if
                  lt is defined else 0 %} {% if lp is not none %}last cycle · {{
                  '%.2f' | format(lu) }} kWh{% else %}last cycle not found{%
                  endif %}
                icon: mdi:calendar-month-outline
                icon_color: disabled

      # ── 2. TOP CONSUMERS (auto-sorted, live) ──────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Top consumers
            heading_style: title
            icon: mdi:podium
          - type: custom:auto-entities
            show_empty: true
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            sort:
              method: state
              numeric: true
              reverse: true
              count: 8
            filter:
              include:
                # Every power sensor in the house...
                - domain: sensor
                  attributes:
                    device_class: power
                  options:
                    type: custom:mushroom-template-card
                    fill_container: true
                    tap_action:
                      action: more-info
                    primary: >-
                      {% set n = {
                        'sensor.fridge_fridge_power': 'Refrigerator',
                        'sensor.hisense_tugs_power': 'Hisense Aircond',
                        'sensor.midea_celest_power': 'Midea Celest',
                        'sensor.midea_all_easy_pro_power': 'Midea AEP',
                        'sensor.celest_bedroom_3_power': 'Midea Celest B3',
                        'sensor.coway_coway_power': 'Coway',
                        'sensor.light_fan_light_fan_power': 'Bed2 · Lights & Fan',
                        'sensor.living_room_tapo_home_server_power': 'Server',
                        'sensor.tapo_computer_plug_power_1': 'Computer',
                        'sensor.tapo_tv_plug_power_1': 'Bedroom TV',
                        'sensor.living_room_tapo_main_tv_power': 'Sharp TV',
                        'sensor.entertainment_power': 'Media, Router & Ext.',
                        'sensor.water_heater_epower': 'Water Heater',
                        'sensor.microwave_epower': 'Microwave',
                        'sensor.washer_dryer_power': 'Washer Dryer',
                        'sensor.kitchen_air_fryer_power': 'Air Fryer',
                        'sensor.elba_hood_power': 'Elba Hood',
                        'sensor.kitchen_rice_cooker_power': 'Rice Cooker',
                        'sensor.living_room_game_console_power': 'PS5',
                        'input_number.lights_watt_baseline': 'Lights & Fans (est.)'
                      } %} {{ n.get(entity, state_attr(entity, 'friendly_name'))
                      }}
                    secondary: '{{ states(entity) | float(0) | round(0) | int }} W'
                    icon: |-
                      {% set i = {
                        'sensor.fridge_fridge_power': 'mdi:fridge',
                        'sensor.hisense_tugs_power': 'mdi:air-conditioner',
                        'sensor.midea_celest_power': 'mdi:air-conditioner',
                        'sensor.midea_all_easy_pro_power': 'mdi:air-conditioner',
                        'sensor.celest_bedroom_3_power': 'mdi:air-conditioner',
                        'sensor.coway_coway_power': 'mdi:air-purifier',
                        'sensor.light_fan_light_fan_power': 'mdi:ceiling-fan-light',
                        'sensor.living_room_tapo_home_server_power': 'mdi:server',
                        'sensor.tapo_computer_plug_power_1': 'mdi:desktop-tower-monitor',
                        'sensor.tapo_tv_plug_power_1': 'mdi:television',
                        'sensor.living_room_tapo_main_tv_power': 'mdi:television',
                        'sensor.entertainment_power': 'mdi:router-wireless',
                        'sensor.water_heater_epower': 'mdi:water-boiler',
                        'sensor.microwave_epower': 'mdi:microwave',
                        'sensor.washer_dryer_power': 'mdi:washing-machine',
                        'sensor.kitchen_air_fryer_power': 'mdi:air-fryer',
                        'sensor.elba_hood_power': 'mdi:range-hood',
                        'sensor.kitchen_rice_cooker_power': 'mdi:rice',
                        'sensor.living_room_game_console_power': 'mdi:sony-playstation',
                        'input_number.lights_watt_baseline': 'mdi:lightbulb-group'
                      } %} {{ i.get(entity, 'mdi:flash') }}
                    icon_color: >-
                      {% set w = states(entity) | float(0) %} {{ 'disabled' if w
                      < 1 else 'green' if w < 100 else 'amber' if w < 500 else
                      'red' }}
                # ...plus your estimated lights & fans (CT B baseline helper)
                - entity_id: input_number.lights_watt_baseline
                  options:
                    type: custom:mushroom-template-card
                    fill_container: true
                    tap_action:
                      action: more-info
                    primary: >-
                      {% set n = {
                        'sensor.fridge_fridge_power': 'Refrigerator',
                        'sensor.hisense_tugs_power': 'Hisense Aircond',
                        'sensor.midea_celest_power': 'Midea Celest',
                        'sensor.midea_all_easy_pro_power': 'Midea AEP',
                        'sensor.celest_bedroom_3_power': 'Midea Celest B3',
                        'sensor.coway_coway_power': 'Coway',
                        'sensor.light_fan_light_fan_power': 'Bed2 · Lights & Fan',
                        'sensor.living_room_tapo_home_server_power': 'Server',
                        'sensor.tapo_computer_plug_power_1': 'Computer',
                        'sensor.tapo_tv_plug_power_1': 'Bedroom TV',
                        'sensor.living_room_tapo_main_tv_power': 'Sharp TV',
                        'sensor.entertainment_power': 'Media, Router & Ext.',
                        'sensor.water_heater_epower': 'Water Heater',
                        'sensor.microwave_epower': 'Microwave',
                        'sensor.washer_dryer_power': 'Washer Dryer',
                        'sensor.kitchen_air_fryer_power': 'Air Fryer',
                        'sensor.elba_hood_power': 'Elba Hood',
                        'sensor.kitchen_rice_cooker_power': 'Rice Cooker',
                        'sensor.living_room_game_console_power': 'PS5',
                        'input_number.lights_watt_baseline': 'Lights & Fans (est.)'
                      } %} {{ n.get(entity, state_attr(entity, 'friendly_name'))
                      }}
                    secondary: '{{ states(entity) | float(0) | round(0) | int }} W'
                    icon: |-
                      {% set i = {
                        'sensor.fridge_fridge_power': 'mdi:fridge',
                        'sensor.hisense_tugs_power': 'mdi:air-conditioner',
                        'sensor.midea_celest_power': 'mdi:air-conditioner',
                        'sensor.midea_all_easy_pro_power': 'mdi:air-conditioner',
                        'sensor.celest_bedroom_3_power': 'mdi:air-conditioner',
                        'sensor.coway_coway_power': 'mdi:air-purifier',
                        'sensor.light_fan_light_fan_power': 'mdi:ceiling-fan-light',
                        'sensor.living_room_tapo_home_server_power': 'mdi:server',
                        'sensor.tapo_computer_plug_power_1': 'mdi:desktop-tower-monitor',
                        'sensor.tapo_tv_plug_power_1': 'mdi:television',
                        'sensor.living_room_tapo_main_tv_power': 'mdi:television',
                        'sensor.entertainment_power': 'mdi:router-wireless',
                        'sensor.water_heater_epower': 'mdi:water-boiler',
                        'sensor.microwave_epower': 'mdi:microwave',
                        'sensor.washer_dryer_power': 'mdi:washing-machine',
                        'sensor.kitchen_air_fryer_power': 'mdi:air-fryer',
                        'sensor.elba_hood_power': 'mdi:range-hood',
                        'sensor.kitchen_rice_cooker_power': 'mdi:rice',
                        'sensor.living_room_game_console_power': 'mdi:sony-playstation',
                        'input_number.lights_watt_baseline': 'mdi:lightbulb-group'
                      } %} {{ i.get(entity, 'mdi:flash') }}
                    icon_color: >-
                      {% set w = states(entity) | float(0) %} {{ 'disabled' if w
                      < 1 else 'green' if w < 100 else 'amber' if w < 500 else
                      'red' }}
              exclude:
                # Meters / helpers that aren't devices
                - entity_id: sensor.energy_meter_main_ct_power
                - entity_id: sensor.energy_meter_lights_ctb_power
                - entity_id: sensor.shelly_ct_b_remaining_power
                - entity_id: sensor.shelly_ct_b_snapshot
                # Duplicate of Midea Celest (living room)
                - entity_id: sensor.150633094438435_realtime_power
                - state: unavailable
                - state: unknown
                - state: < 1
            else:
              type: markdown
              content: Everything is idle 🌙

      # ── 3. AIRCOND (live watts + full control) ────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Aircond
            heading_style: title
            icon: mdi:snowflake
          - type: vertical-stack
            cards:
              - type: custom:mini-graph-card
                name: Bedroom 2 · Hisense
                icon: mdi:air-conditioner
                entities:
                  - entity: sensor.hisense_tugs_power
                hours_to_show: 12
                points_per_hour: 4
                line_width: 2
                font_size: 60
                smoothing: true
                color_thresholds:
                  - value: 0
                    color: '#4ade80'
                  - value: 400
                    color: '#fbbf24'
                  - value: 900
                    color: '#f87171'
                show:
                  fill: fade
                  points: false
                  legend: false
                  labels: false
              - type: custom:mushroom-climate-card
                entity: climate.ai10tugs
                name: Hisense
                show_temperature_control: true
                collapsible_controls: true
                hvac_modes:
                  - false
                  - cool
                  - dry
                  - fan_only
                  - auto
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: template
                    entity: switch.ai10tugs_quiet_mode
                    icon: mdi:volume-off
                    content: Quiet
                    icon_color: '{{ ''blue'' if is_state(entity, ''on'') else ''disabled'' }}'
                    tap_action:
                      action: toggle
                  - type: template
                    entity: switch.ai10tugs_fast_heating_cooling
                    icon: mdi:rocket-launch
                    content: Fast cool
                    icon_color: '{{ ''blue'' if is_state(entity, ''on'') else ''disabled'' }}'
                    tap_action:
                      action: toggle
          - type: vertical-stack
            cards:
              - type: custom:mini-graph-card
                name: Living room · Celest 2HP
                icon: mdi:air-conditioner
                entities:
                  - entity: sensor.midea_celest_power
                hours_to_show: 12
                points_per_hour: 4
                line_width: 2
                font_size: 60
                smoothing: true
                color_thresholds:
                  - value: 0
                    color: '#4ade80'
                  - value: 400
                    color: '#fbbf24'
                  - value: 900
                    color: '#f87171'
                show:
                  fill: fade
                  points: false
                  legend: false
                  labels: false
              - type: custom:mushroom-climate-card
                entity: climate.150633094438435_climate
                name: Celest 2HP
                show_temperature_control: true
                collapsible_controls: true
                hvac_modes:
                  - false
                  - cool
                  - dry
                  - fan_only
                  - auto
          - type: vertical-stack
            cards:
              - type: custom:mini-graph-card
                name: Bedroom · All Easy Pro 1HP
                icon: mdi:air-conditioner
                entities:
                  - entity: sensor.midea_all_easy_pro_power
                hours_to_show: 12
                points_per_hour: 4
                line_width: 2
                font_size: 60
                smoothing: true
                color_thresholds:
                  - value: 0
                    color: '#4ade80'
                  - value: 400
                    color: '#fbbf24'
                  - value: 900
                    color: '#f87171'
                show:
                  fill: fade
                  points: false
                  legend: false
                  labels: false
              - type: custom:mushroom-climate-card
                entity: climate.151732606038013_climate
                name: All Easy Pro
                show_temperature_control: true
                collapsible_controls: true
                hvac_modes:
                  - false
                  - cool
                  - dry
                  - fan_only
                  - auto
          - type: vertical-stack
            cards:
              - type: custom:mini-graph-card
                name: Bedroom 3 · Celest 1HP
                icon: mdi:air-conditioner
                entities:
                  - entity: sensor.celest_bedroom_3_power
                hours_to_show: 12
                points_per_hour: 4
