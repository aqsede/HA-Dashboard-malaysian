                - state: unknown
                - state: < 1
            else:
              type: markdown
              content: Everything is idle 🌙
      # AIRCOND AT A GLANCE  full controls live on the Climate tab
      - type: grid
        cards:
          - type: heading
            heading: Aircond
            heading_style: title
            icon: mdi:snowflake
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: climate.151732606038013_climate
                layout: vertical
                fill_container: true
                primary: All Easy Pro
                secondary: |-
                  {%- set w = states('sensor.midea_all_easy_pro_power') | float(0) -%}
                  {{ states('climate.151732606038013_climate') | replace('_', ' ') | title }}{% if w >= 1 %} · {{ w | round(0) | int }} W{% endif %}
                icon: mdi:air-conditioner
                icon_color: "{{ 'blue' if states('climate.151732606038013_climate') not in ['off', 'unavailable', 'unknown'] else 'disabled' }}"
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: climate.150633094438435_climate
                layout: vertical
                fill_container: true
                primary: Celest 2HP
                secondary: |-
                  {%- set w = states('sensor.midea_celest_power') | float(0) -%}
                  {{ states('climate.150633094438435_climate') | replace('_', ' ') | title }}{% if w >= 1 %} · {{ w | round(0) | int }} W{% endif %}
                icon: mdi:air-conditioner
                icon_color: "{{ 'blue' if states('climate.150633094438435_climate') not in ['off', 'unavailable', 'unknown'] else 'disabled' }}"
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: climate.ai10tugs
                layout: vertical
                fill_container: true
                primary: Hisense
                secondary: |-
                  {%- set w = states('sensor.hisense_tugs_power') | float(0) -%}
                  {{ states('climate.ai10tugs') | replace('_', ' ') | title }}{% if w >= 1 %} · {{ w | round(0) | int }} W{% endif %}
                icon: mdi:air-conditioner
                icon_color: "{{ 'blue' if states('climate.ai10tugs') not in ['off', 'unavailable', 'unknown'] else 'disabled' }}"
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: climate.150633095125593_climate
                layout: vertical
                fill_container: true
                primary: Celest 1HP
                secondary: |-
                  {%- set w = states('sensor.celest_bedroom_3_power') | float(0) -%}
                  {{ states('climate.150633095125593_climate') | replace('_', ' ') | title }}{% if w >= 1 %} · {{ w | round(0) | int }} W{% endif %}
                icon: mdi:air-conditioner
                icon_color: "{{ 'blue' if states('climate.150633095125593_climate') not in ['off', 'unavailable', 'unknown'] else 'disabled' }}"
                tap_action:
                  action: more-info
  - title: Rooms
    path: rooms
    icon: mdi:floor-plan
    theme: Energy Slate
    type: sections
    max_columns: 3
    sections:
      # KITCHEN
