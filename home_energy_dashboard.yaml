                secondary: Night idle · 30d median
                icon: mdi:weather-night
                icon_color: blue
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: input_number.fridge_base_night_w
                layout: vertical
                fill_container: true
                primary: >-
                  {% if has_value(entity) %}{{ states(entity) | float(0) |
                  round(1) }} {{ state_attr(entity, 'unit_of_measurement') or
                  'W' }}{% else %}—{% endif %}
                secondary: Best-ever night idle
                icon: mdi:trophy-outline
                icon_color: green
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.fridge_energy_median_30d
                layout: vertical
                fill_container: true
                primary: >-
                  {% if has_value(entity) %}{{ states(entity) | float(0) |
                  round(1) }} {{ state_attr(entity, 'unit_of_measurement') or
                  '' }}{% else %}—{% endif %}
                secondary: Typical day · 30d
                icon: mdi:flash-outline
                icon_color: amber
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.fridge_grocery_days_30d
                layout: vertical
                fill_container: true
                primary: >-
                  {% if has_value(entity) %}{{ states(entity) | int(0) }}{%
                  else %}—{% endif %}
                secondary: Grocery days · 30d
                icon: mdi:cart-outline
                icon_color: >-
                  {{ 'disabled' if not has_value(entity) else 'green' if
                  states(entity) | int(0) <= 3 else 'amber' }}
                tap_action:
                  action: more-info
          - type: custom:mini-graph-card
            name: Night idle · 90 days
            icon: mdi:fridge-outline
