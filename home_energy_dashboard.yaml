# ─────────────────────────────────────────────────────────────────────────────
# Home Energy dashboard v3 — v2 reconciled against the live entity list + energy tree (2026-11-10)
# v3 changes: fridge health card no longer depends on 5 sensors that don't exist
#   (fridge_health_status / _health_score / _idle_drift / _idle_floor_samples_30d / _grocery_days_30d);
#   Iron tile added (Bedroom 1) + labelled in Top consumers; Top-consumers excludes hardened.
# Install: Settings → Dashboards → Add dashboard → open it → ⋮ → Edit → ⋮ →
#          Raw configuration editor → paste this whole file → Save.
#
# Views:   Now · Rooms · Climate · Bill · Usage
# Needs:   HACS frontend cards  Mushroom, mini-graph-card, auto-entities, apexcharts-card
#          (no card-mod).  Optional theme: energy_slate.yaml → /config/themes/
#          (every view says `theme: Energy Slate`; without the theme HA just uses your default)
#
# Colour rule everywhere:  grey = idle · green = low · amber = medium · red = high
# ─────────────────────────────────────────────────────────────────────────────
title: Home Energy
views:
  - title: Now
    path: now
    icon: mdi:flash
    theme: Energy Slate
    type: sections
    max_columns: 3
    sections:
      # RIGHT NOW  status chips, whole-house load, bill pace
      - type: grid
        cards:
          - type: heading
            heading: Right now
            heading_style: title
            icon: mdi:flash
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: "{%- set n = states.climate | rejectattr('state','in',['off','unavailable','unknown']) | list | length -%}{{ 'mdi:air-conditioner' if n > 0 else '' }}"
                icon_color: blue
                content: "{%- set n = states.climate | rejectattr('state','in',['off','unavailable','unknown']) | list | length -%}{{ (n ~ ' aircond on') if n > 0 else '' }}"
              - type: template
                icon: "{{ 'mdi:water-boiler' if states('sensor.water_heater_epower')|float(0) > 0 else '' }}"
                icon_color: red
                content: "{{ 'Water heater' if states('sensor.water_heater_epower')|float(0) > 0 else '' }}"
              - type: template
                icon: "{{ 'mdi:microwave' if states('sensor.microwave_epower')|float(0) > 0 else '' }}"
                icon_color: amber
                content: "{{ 'Microwave' if states('sensor.microwave_epower')|float(0) > 0 else '' }}"
              - type: template
                icon: "{{ 'mdi:washing-machine' if states('sensor.washer_dryer_power')|float(0) > 5 else '' }}"
                icon_color: teal
                content: "{{ 'Washer/dryer' if states('sensor.washer_dryer_power')|float(0) > 5 else '' }}"
              - type: template
                icon: "{% set n = expand(['sensor.virtual_bedroom_1_main_light_power', 'sensor.virtual_bedroom_1_secondary_light_power', 'sensor.virtual_bedroom_2_light_power', 'sensor.virtual_living_room_top_light_power', 'sensor.virtual_living_room_bottom_light_power', 'sensor.virtual_living_room_balcony_light_power', 'sensor.virtual_living_room_hallway_light_power']) | map(attribute='state') | map('float', 0) | select('gt', 0) | list | length %}{{ 'mdi:lightbulb-on' if n > 0 else '' }}"
                icon_color: yellow
                content: "{% set n = expand(['sensor.virtual_bedroom_1_main_light_power', 'sensor.virtual_bedroom_1_secondary_light_power', 'sensor.virtual_bedroom_2_light_power', 'sensor.virtual_living_room_top_light_power', 'sensor.virtual_living_room_bottom_light_power', 'sensor.virtual_living_room_balcony_light_power', 'sensor.virtual_living_room_hallway_light_power']) | map(attribute='state') | map('float', 0) | select('gt', 0) | list | length %}{{ (n ~ (' lights' if n > 1 else ' light') ~ ' on') if n > 0 else '' }}"
              - type: template
                icon: "{% set n = expand(['sensor.virtual_bedroom_1_fan_power', 'sensor.virtual_bedroom_2_fan_power', 'sensor.virtual_living_room_fan_power']) | map(attribute='state') | map('float', 0) | select('gt', 0) | list | length %}{{ 'mdi:fan' if n > 0 else '' }}"
                icon_color: cyan
                content: "{% set n = expand(['sensor.virtual_bedroom_1_fan_power', 'sensor.virtual_bedroom_2_fan_power', 'sensor.virtual_living_room_fan_power']) | map(attribute='state') | map('float', 0) | select('gt', 0) | list | length %}{{ (n ~ (' fans' if n > 1 else ' fan') ~ ' on') if n > 0 else '' }}"
              - type: template
                icon: "{{ 'mdi:fridge-alert' if is_state('binary_sensor.fridge_sustained_high_load', 'on') else '' }}"
                icon_color: red
                content: "{{ 'Fridge working hard' if is_state('binary_sensor.fridge_sustained_high_load', 'on') else '' }}"
              - type: template
                icon: mdi:receipt-text-outline
                icon_color: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set t = now() -%}
                  {%- set s = (t.replace(day=15) if t.day >= 15 else (t.replace(day=1) - timedelta(days=1)).replace(day=15)).replace(hour=0, minute=0, second=0, microsecond=0) -%}
                  {%- set n = ((s + timedelta(days=20)).replace(day=15) - s).days -%}
                  {%- set el = (t - s).total_seconds() / 86400 -%}
                  {%- set pu = u / el * n if el >= 1 else u -%}
                  {%- set m = 5 + 10 * ((n - el) / n) -%}
                  {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
                  {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
                  {%- set hi = wc.max if wc is defined else 0 -%}
                  {%- set wd = wc.disc if wc is defined else 0 -%}
                  {%- set disc = tc.disc if tc is defined else 0 -%}
                  {%- set pe = 0 if hi <= tgt else (blocks | selectattr('max', 'lt', hi) | map(attribute='max') | max) -%}
                  {%- set lo = pe + 1 if pe > 0 else 0 -%}
                  {{ 'red' if pu > red else ('amber' if pu > tgt - m else 'green') }}
                content: |-
                  {%- set blocks = [{'max': 200, 'disc': -25.0}, {'max': 250, 'disc': -24.5}, {'max': 300, 'disc': -22.5}, {'max': 350, 'disc': -21.0}, {'max': 400, 'disc': -17.0}, {'max': 450, 'disc': -14.5}, {'max': 500, 'disc': -12.0}, {'max': 550, 'disc': -10.5}, {'max': 600, 'disc': -9.0}] -%}
                  {%- set base = 0.2703 + 0.0455 + 0.1285 -%}
                  {%- set k = 1.06 -%}
                  {%- set tgt = 250 -%}
                  {%- set flex = 260 -%}
                  {%- set red = 280 -%}
                  {%- set raw = states('sensor.monthly_grid_kwh_usage') | float(0) -%}
                  {%- set u = raw * k -%}
                  {%- set t = now() -%}
                  {%- set s = (t.replace(day=15) if t.day >= 15 else (t.replace(day=1) - timedelta(days=1)).replace(day=15)).replace(hour=0, minute=0, second=0, microsecond=0) -%}
                  {%- set n = ((s + timedelta(days=20)).replace(day=15) - s).days -%}
                  {%- set el = (t - s).total_seconds() / 86400 -%}
                  {%- set pu = u / el * n if el >= 1 else u -%}
                  {%- set m = 5 + 10 * ((n - el) / n) -%}
                  {%- set tc = blocks | selectattr('max', 'ge', u) | first -%}
                  {%- set wc = blocks | selectattr('max', 'ge', [u, tgt] | max) | first -%}
                  {%- set hi = wc.max if wc is defined else 0 -%}
                  {%- set wd = wc.disc if wc is defined else 0 -%}
                  {%- set disc = tc.disc if tc is defined else 0 -%}
                  {%- set pe = 0 if hi <= tgt else (blocks | selectattr('max', 'lt', hi) | map(attribute='max') | max) -%}
                  {%- set lo = pe + 1 if pe > 0 else 0 -%}
                  {%- set pc = blocks | selectattr('max', 'ge', pu) | first -%}
                  {%- set pd = pc.disc if pc is defined else 0 -%}
                  {%- set projc = pu * (base + pd / 100) -%}
                  {%- set atcap = hi * (base + wd / 100) if hi else 0 -%}
                  {%- set cross = hi > 0 and pu > hi -%}
                  {%- set avg = u / el if el >= 1 else u -%}
                  {%- if el < 1 -%}Bill · day 1/{{ n }}
                  {%- else -%}{{ pu | round(0) | int }} kWh proj · ~RM {{ '%.0f' | format(projc) }}
                  {%- endif -%}
          - type: custom:mini-graph-card
            name: Whole house
            icon: mdi:home-lightning-bolt
            entities:
              - entity: sensor.energy_meter_main_ct_power
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            font_size: 70
            smoothing: true
            show:
              fill: fade
              points: false
              legend: false
              labels: false
              extrema: true
              average: true
            animate: true
            color_thresholds:
              - value: 0
                color: '#4ade80'
              - value: 600
                color: '#fbbf24'
              - value: 1500
                color: '#f87171'
            grid_options:
              columns: full
      # TOP CONSUMERS  auto-sorted, with share of whole-house load
      - type: grid
        cards:
          - type: heading
            heading: Top consumers
            heading_style: title
            icon: mdi:podium
          - type: custom:auto-entities
            show_empty: true
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            sort:
              method: state
              numeric: true
              reverse: true
              count: 10
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: power
                  options:
                    type: custom:mushroom-template-card
                    fill_container: true
                    tap_action:
                      action: more-info
                    primary: |-
                      {%- set n = {
                        'sensor.fridge_fridge_power': 'Refrigerator',
                        'sensor.hisense_tugs_power': 'Hisense Aircond',
                        'sensor.midea_celest_power': 'Midea Celest',
                        'sensor.midea_all_easy_pro_power': 'Midea AEP',
                        'sensor.celest_bedroom_3_power': 'Midea Celest B3',
                        'sensor.coway_coway_power': 'Coway',
                        'sensor.light_fan_light_fan_power': 'Bed2 · Lights & Fan',
                        'sensor.living_room_tapo_home_server_power': 'Server',
                        'sensor.tapo_computer_plug_power_1': 'Computer',
                        'sensor.tapo_tv_plug_power_1': 'Bedroom TV',
                        'sensor.living_room_tapo_main_tv_power': 'Sharp TV',
                        'sensor.water_heater_epower': 'Water Heater',
                        'sensor.microwave_epower': 'Microwave',
                        'sensor.washer_dryer_power': 'Washer Dryer',
                        'sensor.kitchen_air_fryer_power': 'Air Fryer',
                        'sensor.elba_hood_power': 'Elba Hood',
                        'sensor.kitchen_rice_cooker_power': 'Rice Cooker',
                        'sensor.bedroom_iron_power': 'Iron',
                        'sensor.living_room_game_console_power': 'PS5',
                        'input_number.lights_watt_baseline': 'Lights & Fans (est.)'
                      } -%}
                      {{ n.get(entity, state_attr(entity, 'friendly_name')) }}
                    secondary: |-
                      {%- set w = states(entity) | float(0) -%}
                      {%- set tot = states('sensor.energy_meter_main_ct_power') | float(0) -%}
                      {{ w | round(0) | int }} W{% if tot > 50 %} · {{ (w / tot * 100) | round(0) | int }}%{% endif %}
                    icon: |-
                      {%- set i = {
                        'sensor.fridge_fridge_power': 'mdi:fridge',
                        'sensor.hisense_tugs_power': 'mdi:air-conditioner',
                        'sensor.midea_celest_power': 'mdi:air-conditioner',
                        'sensor.midea_all_easy_pro_power': 'mdi:air-conditioner',
                        'sensor.celest_bedroom_3_power': 'mdi:air-conditioner',
                        'sensor.coway_coway_power': 'mdi:air-purifier',
                        'sensor.light_fan_light_fan_power': 'mdi:ceiling-fan-light',
                        'sensor.living_room_tapo_home_server_power': 'mdi:server',
                        'sensor.tapo_computer_plug_power_1': 'mdi:desktop-tower-monitor',
                        'sensor.tapo_tv_plug_power_1': 'mdi:television',
                        'sensor.living_room_tapo_main_tv_power': 'mdi:television',
                        'sensor.water_heater_epower': 'mdi:water-boiler',
                        'sensor.microwave_epower': 'mdi:microwave',
                        'sensor.washer_dryer_power': 'mdi:washing-machine',
                        'sensor.kitchen_air_fryer_power': 'mdi:air-fryer',
                        'sensor.elba_hood_power': 'mdi:range-hood',
                        'sensor.kitchen_rice_cooker_power': 'mdi:rice',
                        'sensor.bedroom_iron_power': 'mdi:iron',
                        'sensor.living_room_game_console_power': 'mdi:sony-playstation',
                        'input_number.lights_watt_baseline': 'mdi:lightbulb-group'
                      } -%}
                      {{ i.get(entity, 'mdi:flash') }}
                    icon_color: |-
                      {%- set w = states(entity) | float(0) -%}
                      {%- set limits = {
                        'sensor.fridge_fridge_power': [80, 250],
                        'sensor.hisense_tugs_power': [300, 900],
                        'sensor.midea_celest_power': [700, 1900],
                        'sensor.midea_all_easy_pro_power': [250, 800],
                        'sensor.celest_bedroom_3_power': [300, 900],
                        'sensor.coway_coway_power': [100, 470],
                        'sensor.light_fan_light_fan_power': [100, 300],
                        'sensor.living_room_tapo_home_server_power': [15, 23],
                        'sensor.tapo_computer_plug_power_1': [60, 400],
                        'sensor.tapo_tv_plug_power_1': [30, 100],
                        'sensor.living_room_tapo_main_tv_power': [50, 180],
                        'sensor.water_heater_epower': [1699.99, 3000],
                        'sensor.microwave_epower': [400, 1600],
                        'sensor.washer_dryer_power': [300, 2500],
                        'sensor.kitchen_air_fryer_power': [500, 1800],
                        'sensor.elba_hood_power': [80, 300],
                        'sensor.kitchen_rice_cooker_power': [80, 900],
                        'sensor.bedroom_iron_power': [800, 1800],
                        'sensor.living_room_game_console_power': [70, 220],
                        'input_number.lights_watt_baseline': [100, 300]
                      } -%}
                      {%- set b = limits.get(entity, [100, 500]) -%}
                      {{ 'disabled' if w < 1 else 'green' if w <= b[0] else 'amber' if w <= b[1] else 'red' }}
                - entity_id: input_number.lights_watt_baseline
                  options:
                    type: custom:mushroom-template-card
                    fill_container: true
                    tap_action:
                      action: more-info
                    primary: |-
                      {%- set n = {
                        'sensor.fridge_fridge_power': 'Refrigerator',
                        'sensor.hisense_tugs_power': 'Hisense Aircond',
                        'sensor.midea_celest_power': 'Midea Celest',
                        'sensor.midea_all_easy_pro_power': 'Midea AEP',
                        'sensor.celest_bedroom_3_power': 'Midea Celest B3',
                        'sensor.coway_coway_power': 'Coway',
                        'sensor.light_fan_light_fan_power': 'Bed2 · Lights & Fan',
                        'sensor.living_room_tapo_home_server_power': 'Server',
                        'sensor.tapo_computer_plug_power_1': 'Computer',
                        'sensor.tapo_tv_plug_power_1': 'Bedroom TV',
                        'sensor.living_room_tapo_main_tv_power': 'Sharp TV',
                        'sensor.water_heater_epower': 'Water Heater',
                        'sensor.microwave_epower': 'Microwave',
                        'sensor.washer_dryer_power': 'Washer Dryer',
                        'sensor.kitchen_air_fryer_power': 'Air Fryer',
                        'sensor.elba_hood_power': 'Elba Hood',
                        'sensor.kitchen_rice_cooker_power': 'Rice Cooker',
                        'sensor.bedroom_iron_power': 'Iron',
                        'sensor.living_room_game_console_power': 'PS5',
                        'input_number.lights_watt_baseline': 'Lights & Fans (est.)'
                      } -%}
                      {{ n.get(entity, state_attr(entity, 'friendly_name')) }}
                    secondary: |-
                      {%- set w = states(entity) | float(0) -%}
                      {%- set tot = states('sensor.energy_meter_main_ct_power') | float(0) -%}
                      {{ w | round(0) | int }} W{% if tot > 50 %} · {{ (w / tot * 100) | round(0) | int }}%{% endif %}
                    icon: |-
                      {%- set i = {
                        'sensor.fridge_fridge_power': 'mdi:fridge',
                        'sensor.hisense_tugs_power': 'mdi:air-conditioner',
                        'sensor.midea_celest_power': 'mdi:air-conditioner',
                        'sensor.midea_all_easy_pro_power': 'mdi:air-conditioner',
                        'sensor.celest_bedroom_3_power': 'mdi:air-conditioner',
                        'sensor.coway_coway_power': 'mdi:air-purifier',
                        'sensor.light_fan_light_fan_power': 'mdi:ceiling-fan-light',
                        'sensor.living_room_tapo_home_server_power': 'mdi:server',
                        'sensor.tapo_computer_plug_power_1': 'mdi:desktop-tower-monitor',
                        'sensor.tapo_tv_plug_power_1': 'mdi:television',
                        'sensor.living_room_tapo_main_tv_power': 'mdi:television',
                        'sensor.water_heater_epower': 'mdi:water-boiler',
                        'sensor.microwave_epower': 'mdi:microwave',
