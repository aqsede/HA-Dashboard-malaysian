                  {% set w = states('sensor.tapo_computer_plug_power_1') | float(0) %}
                  {{ 'disabled' if w < 1 else 'green' if w < 100 else 'amber' if w < 500 else 'red' }}
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: switch.smart_wi_fi_plug
                layout: vertical
                fill_container: true
                primary: Bedroom TV
                secondary: "{{ states('sensor.tapo_tv_plug_power_1') | float(0) | round(0) | int }} W"
                icon: mdi:television
                icon_color: >-
                  {% set w = states('sensor.tapo_tv_plug_power_1') | float(0) %}
                  {{ 'disabled' if w < 1 else 'green' if w < 100 else 'amber' if w < 500 else 'red' }}
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.light_fan_light_fan_power
                layout: vertical
                fill_container: true
                primary: Lights & Fan
                secondary: "{{ states('sensor.light_fan_light_fan_power') | float(0) | round(0) | int }} W"
                icon: mdi:ceiling-fan-light
                icon_color: >-
                  {% set w = states('sensor.light_fan_light_fan_power') | float(0) %}
                  {{ 'disabled' if w < 1 else 'green' if w < 100 else 'amber' if w < 500 else 'red' }}
                tap_action:
                  action: more-info

          - type: custom:mushroom-title-card
            title: Yard & estimated
            subtitle: Washer/dryer and CT-B estimates
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.washer_dryer_power
                layout: vertical
                fill_container: true
                primary: Washer Dryer
                secondary: "{{ states('sensor.washer_dryer_power') | float(0) | round(0) | int }} W"
                icon: mdi:washing-machine
                icon_color: >-
                  {% set w = states('sensor.washer_dryer_power') | float(0) %}
                  {{ 'disabled' if w < 5 else 'green' if w < 100 else 'amber' if w < 800 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.water_heater_epower
                layout: vertical
                fill_container: true
                primary: Water Heater
                secondary: "{{ states('sensor.water_heater_epower') | float(0) | round(0) | int }} W (est.)"
                icon: mdi:water-boiler
                icon_color: >-
                  {% set w = states('sensor.water_heater_epower') | float(0) %}
                  {{ 'disabled' if w < 1 else 'red' }}
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: input_number.lights_watt_baseline
                layout: vertical
                fill_container: true
                primary: Lights & Fans
                secondary: "{{ states('input_number.lights_watt_baseline') | float(0) | round(0) | int }} W (est.)"
                icon: mdi:lightbulb-group
                icon_color: >-
                  {% set w = states('input_number.lights_watt_baseline') | float(0) %}
                  {{ 'disabled' if w < 1 else 'green' if w < 100 else 'amber' if w < 500 else 'red' }}
                tap_action:
                  action: more-info

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 2 — USAGE (history, uses HA's built-in energy cards)
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Usage
    path: usage
    icon: mdi:chart-areaspline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: energy-date-selection
          - type: energy-sankey
          - type: energy-devices-graph
            title: Individual devices
      - type: grid
        cards:
          - type: custom:apexcharts-card
            graph_span: 24h
            chart_type: area
            header:
              show: true
              title: Power · last 24 h
              show_states: false
            apex_config:
              chart:
                stacked: true
                height: 300
              stroke:
                width: 1
              legend:
                show: true
                position: bottom
              yaxis:
                decimalsInFloat: 0
                title:
                  text: W
            series:
              - entity: sensor.fridge_fridge_power
                name: Refrigerator
                color: "#f59e0b"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.hisense_tugs_power
                name: Hisense AC
                color: "#2563eb"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.midea_celest_power
                name: Celest 2HP
                color: "#60a5fa"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.midea_all_easy_pro_power
                name: All Easy Pro
                color: "#93c5fd"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.celest_bedroom_3_power
                name: Celest B3
                color: "#1d4ed8"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.living_room_tapo_home_server_power
                name: Server
                color: "#a78bfa"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.tapo_computer_plug_power_1
                name: Computer
                color: "#8b5cf6"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.tapo_tv_plug_power_1
                name: Bedroom TV
                color: "#2dd4bf"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.living_room_tapo_main_tv_power
                name: Sharp TV
                color: "#14b8a6"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.entertainment_power
                name: Media & Router
                color: "#5eead4"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.light_fan_light_fan_power
                name: Bed2 Lights & Fan
                color: "#f472b6"
                group_by: { func: avg, duration: 15min }
              - entity: sensor.coway_coway_power
                name: Coway
                color: "#94a3b8"
                group_by: { func: avg, duration: 15min }
          - type: energy-devices-detail-graph
            title: Device usage over time
          - type: energy-sources-table
